name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Generated code is up to date
        run: |
          go run ./tools/gen
          git diff --exit-code -- internal/protocol
          test -z "$(git status --porcelain -- internal/protocol)"
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Hook p95 bench (alone, under 30 ms over 200 runs)
        run: TEAMFLOW_BENCH=1 go test -count=1 -v -run 'P95' ./bench/
      - name: Build with a version
        run: |
          go build -ldflags "-X main.version=ci-${GITHUB_SHA::7}" -o teamflow ./cmd/teamflow
          ./teamflow --version | grep -qx "teamflow ci-${GITHUB_SHA::7}"
